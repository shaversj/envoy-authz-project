admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
    - name: ingress
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          timestamp: "%START_TIME%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          protocol: "%PROTOCOL%"
                          response_code: "%RESPONSE_CODE%"
                          response_code_details: "%RESPONSE_CODE_DETAILS%"
                          response_flags: "%RESPONSE_FLAGS%"
                          duration_ms: "%DURATION%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          upstream_host: "%UPSTREAM_HOST%"
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: backend
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        demo:
                          issuer: http://127.0.0.1:8002
                          audiences:
                            - envoy-demo
                          remote_jwks:
                            http_uri:
                              uri: http://127.0.0.1:8002/.well-known/jwks.json
                              cluster: jwt-issuer
                              timeout: 1s
                            cache_duration: 300s
                          forward: false
                          from_headers:
                            - name: Authorization
                              value_prefix: "Bearer "
                          claim_to_headers:
                            - header_name: x-authenticated-subject
                              claim_name: sub
                            - header_name: x-authenticated-scope
                              claim_name: scope
                      rules:
                        - match:
                            prefix: "/"
                          requires:
                            provider_name: demo
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      failure_mode_allow: false
                      allowed_headers:
                        patterns:
                          - exact: x-authenticated-subject
                          - exact: x-authenticated-scope
                      disallowed_headers:
                        patterns:
                          - exact: authorization
                      http_service:
                        server_uri:
                          uri: http://127.0.0.1:8000
                          cluster: ext-authz
                          timeout: 0.25s
                        path_override: /authorize
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - exact: x-custom-header-from-authz
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: backend
      type: STATIC
      connect_timeout: 0.25s
      load_assignment:
        cluster_name: backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 8081

    - name: ext-authz
      type: STATIC
      connect_timeout: 0.25s
      load_assignment:
        cluster_name: ext-authz
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 8000

    - name: jwt-issuer
      type: STATIC
      connect_timeout: 0.25s
      load_assignment:
        cluster_name: jwt-issuer
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 8002

